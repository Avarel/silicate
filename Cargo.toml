[package]
name = "silicate"
version = "0.2.1"
edition = "2021"
authors = ["An Tran <antran@caltech.edu>"]
description = "Cross-platform GPU-accelerated Procreate file viewer.s"
readme = "README.md"
repository = "https://github.com/Avarel/procreate-rs"
license = "MIT"

[workspace]
members = ["libs/compositor", "libs/lz4_flex", "libs/silica"]

[features]
default = []

[dependencies]
silicate-compositor = { path = "libs/compositor" }
silica = { path = "libs/silica" }

clap = { version = "4.5", features = ["cargo", "derive"] }

image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "tiff",
    "webp",
    "bmp",
] }
# Display GUI
egui = "0.32"
egui-wgpu = "0.32.0"
egui-winit = "0.32.0"
# winit = "0.29"
egui_dock = "0.17"
egui-notify = "0.20"

rfd = { version = "0.15", default-features = false, features = [
    "tokio",
    "xdg-portal",
] }
# Async runtime
tokio = { version = "1.47", features = ["sync", "rt-multi-thread"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[build-dependencies]
cc = "1.0"

[package.metadata.bundle]
name = "Silicate"
identifier = "io.antran.silicate"
icon = ["assets/icon.ico"]
category = "Utility"
